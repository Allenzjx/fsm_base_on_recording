[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wlr50-clean"
version = "0.1.0"
description = "Clean-room, recording-shaped sensor FSM for WLR 50 mm traversal"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
ppo-artifacts = ["pyarrow>=21.0"]
ppo-training = [
  "gymnasium>=1.2,<1.3",
  "rsl-rl-lib==5.0.1",
]
ppo-reporting = [
  "matplotlib>=3.8,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
